services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keitaro-wrapper-backend
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/keitaro_wrapper.db
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000/api
    container_name: keitaro-wrapper-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
